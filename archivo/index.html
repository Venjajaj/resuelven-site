<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>resuelven · Archivo de trabajos</title>
  <!-- pagina para mandar por link: no aparece en el sitio, ni en el sitemap, ni en buscadores -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <script>
    // La clave de los trabajos privados viaja en el fragmento (#...), que nunca llega al servidor.
    // Se guarda para la sesion y se saca de la barra antes de que cargue la medicion.
    (function () {
      var k = location.hash.slice(1);
      try { if (k) sessionStorage.setItem("rsv_archivo", k); else k = sessionStorage.getItem("rsv_archivo") || ""; } catch (e) {}
      window.__archivoClave = k;
      if (location.hash) history.replaceState(null, "", location.pathname + location.search);
    })();
  </script>
  <base href="../">
  <link rel="icon" href="assets/images/favicon-n.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .archivo { padding-top: 140px; }
    .archivo + .archivo { padding-top: 40px; }
    .archivo__intro { color: var(--muted); max-width: 60ch; margin: 10px 0 0; font-size: 17px; }
    .archivo__carga { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted);
      font: 500 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .14em; text-transform: uppercase; }
    .work__media img.cifrada { opacity: 0; transition: opacity .5s; }
    .work__media img.cifrada.lista { opacity: 1; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header class="nav" id="nav">
    <a class="nav__logo" href="./" aria-label="resuelven">
      <svg viewBox="0 0 248 60" xmlns="http://www.w3.org/2000/svg" role="img">
        <text x="0" y="46" font-family="Space Grotesk, sans-serif" font-size="40" font-weight="700" letter-spacing="-1.3" fill="currentColor">resuelve</text>
        <g fill="#88ACD6">
          <rect x="156" y="24" width="6" height="6"/><rect x="156" y="32" width="6" height="6"/>
          <rect x="156" y="40" width="6" height="6"/>
          <rect x="164" y="24" width="6" height="6"/><rect x="172" y="24" width="6" height="6"/>
          <rect x="180" y="32" width="6" height="6"/><rect x="180" y="40" width="6" height="6" opacity=".85"/>
          <rect x="190" y="27" width="4" height="4" opacity=".5"/>
          <rect x="195" y="41" width="3" height="3" opacity=".35"/>
        </g>
        <text x="202" y="26" font-family="Space Grotesk, sans-serif" font-size="12" font-weight="600" fill="#88ACD6">™</text>
      </svg>
    </a>
  </header>

  <section class="section archivo" id="privado" hidden>
    <div class="section__head">
      <h1 class="section__title">Trabajos recientes</h1>
      <p class="archivo__intro">Todavía no son públicos. Te pedimos que no compartas este link.</p>
    </div>
    <div class="workgrid" id="privgrid"></div>
  </section>

  <section class="section archivo" id="work">
    <div class="section__head">
      <h2 class="section__title" id="pubTitle">Todos los proyectos</h2>
    </div>
    <div class="workfilter" id="workfilter"></div>
    <div class="workgrid" id="workgrid"></div>
  </section>

  <div class="lightbox" id="lightbox">
    <div class="lightbox__backdrop"></div>
    <div class="lightbox__body">
      <button class="lightbox__close" id="lightboxClose" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="lightbox__media" id="lightboxMedia"></div>
    </div>
  </div>

  <script src="js/analytics.js"></script>
  <script>
  "use strict";
  const grid = document.getElementById("workgrid");
  const privGrid = document.getElementById("privgrid");
  const lightbox = document.getElementById("lightbox");
  const lightboxMedia = document.getElementById("lightboxMedia");
  const CATS = [["all", "Todos"], ["ficcion", "Ficción"], ["animacion", "Animación"], ["publicidad", "Publicidad"]];
  let abierto = 0;   // para no pisar un video si se cierra mientras descarga

  function closeLightbox() { abierto++; lightbox.classList.remove("open"); lightboxMedia.innerHTML = ""; }
  lightbox.querySelector(".lightbox__backdrop").addEventListener("click", closeLightbox);
  document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
  addEventListener("keydown", (e) => { if (e.key === "Escape" && lightbox.classList.contains("open")) closeLightbox(); });
  const medir = (titulo) => window.medir?.("trabajo_abierto", { trabajo: titulo, pagina: "archivo" });

  const formato = (card) => lightbox.style.setProperty("--ar", card.style.getPropertyValue("--ar") || "1.778");
  function openPublic(card) {
    abierto++;
    formato(card);
    const d = card.dataset;
    lightboxMedia.innerHTML = d.media === "video"
      ? `<video src="${d.src}" ${d.poster ? `poster="${d.poster}"` : ""} controls controlsList="nofullscreen" disablePictureInPicture autoplay playsinline></video>`
      : `<iframe src="${d.src}" allow="autoplay"></iframe>`;
    lightbox.classList.add("open");
    medir(card.querySelector(".work__title")?.textContent.trim() || d.src);
  }

  // ───────── trabajos privados: se bajan cifrados y se abren en el navegador ─────────
  let KEY = null, RAW = null, FILES = {}, SW = null;
  const b64url = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
  async function descifrar(b, aad) {
    const alg = { name: "AES-GCM", iv: b.subarray(0, 12) };
    if (aad) alg.additionalData = new TextEncoder().encode(aad);
    return new Uint8Array(await crypto.subtle.decrypt(alg, KEY, b.subarray(12)));
  }
  const bajar = async (f) => { const r = await fetch(`archivo/m/${f}`); if (!r.ok) throw new Error(r.status); return new Uint8Array(await r.arrayBuffer()); };
  const urls = new Map();
  async function poster(t) {
    if (!urls.has(t.poster)) urls.set(t.poster, URL.createObjectURL(new Blob([await descifrar(await bajar(t.poster + ".bin"))], { type: "image/jpeg" })));
    return urls.get(t.poster);
  }
  // respaldo sin service worker: todos los pedazos, y recien ahi se reproduce
  async function videoEntero(t, onp) {
    if (urls.has(t.video)) return urls.get(t.video);
    const partes = [];
    for (let i = 0; i < t.chunks; i++) {
      partes.push(await descifrar(await bajar(`${t.video}-${String(i).padStart(3, "0")}.bin`), `${t.video}:${i}`));
      onp((i + 1) / t.chunks);
    }
    urls.set(t.video, URL.createObjectURL(new Blob(partes, { type: "video/mp4" })));
    return urls.get(t.video);
  }

  // el service worker descifra de a pedazos mientras se reproduce
  const mandarClave = (destino) => destino.postMessage({ type: "clave", raw: RAW, files: FILES });
  async function prepararSW() {
    if (!("serviceWorker" in navigator)) return;
    try {
      navigator.serviceWorker.addEventListener("message", (e) => {
        if (e.data?.type === "pedir-clave" && RAW) mandarClave(e.ports[0]);
      });
      const reg = await navigator.serviceWorker.register("archivo/sw.js", { scope: "archivo/" });
      await navigator.serviceWorker.ready;
      if (!navigator.serviceWorker.controller) {
        await new Promise((ok, ko) => {
          navigator.serviceWorker.addEventListener("controllerchange", ok, { once: true });
          setTimeout(ko, 3000);
        });
      }
      mandarClave(reg.active);
      SW = reg;
    } catch { SW = null; }
  }

  function reproducir(t, yo, src, alFallar) {
    const v = document.createElement("video");
    Object.assign(v, { controls: true, autoplay: true, playsInline: true, disablePictureInPicture: true });
    v.setAttribute("controlsList", "nofullscreen nodownload");
    if (urls.has(t.poster)) v.poster = urls.get(t.poster);
    if (alFallar) v.addEventListener("error", alFallar, { once: true });
    v.src = src;
    if (yo === abierto) lightboxMedia.replaceChildren(v);
  }
  async function abrirPrivado(t, card) {
    const yo = ++abierto;
    formato(card);
    lightboxMedia.innerHTML = `<div class="archivo__carga">Cargando</div>`;
    lightbox.classList.add("open");
    medir(t.titulo);
    const entero = async () => {
      try {
        const src = await videoEntero(t, (p) => {
          const el = lightboxMedia.querySelector(".archivo__carga");
          if (el && yo === abierto) el.textContent = `Cargando ${Math.round(p * 100)}%`;
        });
        reproducir(t, yo, src);
      } catch {
        if (yo === abierto) lightboxMedia.innerHTML = `<div class="archivo__carga">No se pudo abrir el video</div>`;
      }
    };
    if (SW && navigator.serviceWorker.controller) {
      if (RAW) mandarClave(navigator.serviceWorker.controller);
      reproducir(t, yo, `archivo/v/${t.video}.mp4`, () => {
        if (yo !== abierto) return;
        lightboxMedia.innerHTML = `<div class="archivo__carga">Cargando</div>`;
        entero();
      });
    } else entero();
  }

  function ficha(t) {
    const card = document.createElement("div");
    card.className = "work"; card.dataset.cat = t.cat;
    card.innerHTML = `<div class="work__media"><img class="cifrada" alt=""><div class="work__play"><span>▶</span></div></div>
      <div class="work__info"><h3 class="work__title"></h3><p class="work__meta"></p><p class="work__roles"></p></div>`;
    card.querySelector("img").alt = t.alt;
    card.querySelector(".work__title").textContent = t.titulo;
    card.querySelector(".work__meta").textContent = t.meta;
    card.querySelector(".work__roles").textContent = t.roles;
    poster(t).then((u) => {
      const img = card.querySelector("img");
      img.onload = () => { card.style.setProperty("--ar", (img.naturalWidth / img.naturalHeight).toFixed(3)); img.classList.add("lista"); };
      img.src = u;
    }).catch(() => {});
    card.querySelector(".work__media").addEventListener("click", () => abrirPrivado(t, card));
    return card;
  }
  async function privados() {
    const k = window.__archivoClave;
    if (!k || !window.crypto?.subtle) return false;
    try {
      RAW = b64url(k);
      KEY = await crypto.subtle.importKey("raw", RAW, "AES-GCM", false, ["decrypt"]);
      const { trabajos } = JSON.parse(new TextDecoder().decode(await descifrar(await bajar("indice.bin"))));
      trabajos.forEach((t) => { FILES[t.video] = { size: t.videoSize, chunk: t.chunk, chunks: t.chunks }; });
      trabajos.forEach((t) => privGrid.appendChild(ficha(t)));
      document.getElementById("privado").hidden = false;
      document.getElementById("pubTitle").textContent = "Trabajos publicados";
      prepararSW();
      return true;
    } catch { return false; }
  }

  // ───────── galeria publica: se trae de la home, asi nunca queda desactualizada ─────────
  async function publicos() {
    try {
      const html = await (await fetch("index.html")).text();
      const doc = new DOMParser().parseFromString(html, "text/html");
      doc.querySelectorAll("#workgrid .work").forEach((card) => {
        card.classList.remove("work--hidden");
        card.removeAttribute("data-hidden-by-more");
        const c = document.importNode(card, true);
        c.querySelector(".work__media").addEventListener("click", () => openPublic(c));
        grid.appendChild(c);
      });
      const footer = doc.querySelector("footer.footer");
      if (footer) document.body.insertBefore(document.importNode(footer, true), lightbox);
    } catch {}
  }

  function filtros() {
    const wrap = document.getElementById("workfilter");
    wrap.innerHTML = CATS.map(([c, t], i) => `<button class="workfilter__pill${i ? "" : " active"}" data-cat="${c}">${t}</button>`).join("");
    wrap.addEventListener("click", (e) => {
      const btn = e.target.closest(".workfilter__pill"); if (!btn) return;
      wrap.querySelectorAll(".workfilter__pill").forEach((b) => b.classList.toggle("active", b === btn));
      grid.querySelectorAll(".work").forEach((el) => {
        el.style.display = btn.dataset.cat === "all" || el.dataset.cat === btn.dataset.cat ? "" : "none";
      });
    });
  }

  Promise.all([privados(), publicos()]).then(() => { filtros(); });
  </script>
</body>
</html>
